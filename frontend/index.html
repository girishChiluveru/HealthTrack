<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HealthTrack helps patients log symptoms, follow severity over time, and share records with their doctors."
    />
    <meta name="theme-color" content="#f6f5fc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HealthTrack</title>
    <script>
      // Runs before the first paint, so a dark theme never flashes light. See src/theme.js.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('healthtrack.theme');
        } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').content = '#110f20';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
